name: Auto Refresh Naukri Profile

on:
  schedule:
    # Runs at 10:00 AM IST (04:30 UTC) and 5:30 PM IST (12:00 UTC) every day
    - cron: '30 4,12 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  refresh-profile:
    name: Refresh Profile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium & System Dependencies
        run: |
          playwright install chromium --with-deps

      - name: Run Naukri Profile Updater (Virtual Display)
        env:
          NAUKRI_AUTH_JSON: ${{ secrets.NAUKRI_AUTH_JSON }}
          HEADLESS: "false"
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python naukri_updater.py
